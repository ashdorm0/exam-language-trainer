<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Language Trainer - Lecturer Tool</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="libs/compromise.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div class="container">
        <h1>Exam Language Trainer</h1>
        <p>Upload an exam paper to extract vocabulary</p>
        
        <div class="upload-section">
            <input type="file" id="fileInput" accept=".txt">
            <button id="uploadBtn">Process File</button>
        </div>
        
        <!-- Subject Selection -->
        <div class="subject-section" style="margin: 20px 0;">
            <label for="subjectSelect" style="font-weight: bold; display: block; margin-bottom: 10px;">
                Select Exam Subject:
            </label>
            <select id="subjectSelect" style="padding: 10px; font-size: 16px; width: 100%; max-width: 400px;">
                <option value="Software Engineering">Software Engineering</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Business Studies">Business Studies</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Biology">Biology</option>
                <option value="Economics">Economics</option>
            </select>
        </div>

        <div id="output" class="output-section">
            <!-- Extracted text will appear here -->
        </div>
    </div>
    
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Language Trainer — My Quizzes</title>

    <!-- Google Font — DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #46ACC2;
            --primary-dark: #3d97ab;
            --primary-light: #42F2F7;
            --accent: #498C8A;
            --success: #2a9d6e;
            --danger: #d94444;
            --bg: #f5f8f8;
            --surface: #ffffff;
            --border: #d8e3e3;
            --text: #4B6858;
            --text-dark: #2d3d33;
            --muted: #6b8076;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        .app-header {
            background: linear-gradient(135deg, #498C8A 0%, #3d7a78 100%);
            color: white;
            padding: 1.1rem 0;
            border-bottom: 3px solid var(--primary-light);
        }
        .app-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .app-header .subtitle {
            font-size: 0.82rem;
            opacity: 0.75;
            margin: 0;
            font-weight: 400;
        }

        .quiz-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 0.85rem;
            box-shadow: 0 1px 3px rgba(75, 104, 88, 0.06);
            transition: all 0.2s ease;
        }
        .quiz-item:hover {
            box-shadow: 0 4px 16px rgba(75, 104, 88, 0.08);
        }

        .quiz-title {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.2rem;
        }
        .quiz-meta {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            font-weight: 400;
        }
        .quiz-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-action {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.85rem;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: #fafcfc;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-action:hover {
            background: rgba(66, 242, 247, 0.06);
            border-color: var(--primary);
            color: var(--primary-dark);
        }
        .btn-delete {
            border-color: #f5c6c6;
            color: var(--danger);
        }
        .btn-delete:hover {
            background: #fef2f2;
            border-color: var(--danger);
        }

        .share-url {
            font-family: 'DM Sans', monospace;
            font-size: 0.82rem;
            word-break: break-all;
            color: var(--primary-dark);
            background: rgba(70, 172, 194, 0.08);
            padding: 0.55rem 0.8rem;
            border-radius: 6px;
            margin-top: 0.75rem;
            border: 1px solid rgba(70, 172, 194, 0.15);
        }
        .qr-container {
            margin-top: 0.75rem;
        }
        .quiz-detail-panel {
            display: none;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }
        .quiz-detail-panel.open { display: block; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--muted);
        }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; color: var(--primary); }

        .nav-link-back {
            font-size: 0.88rem;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }
        .nav-link-back:hover { text-decoration: underline; color: var(--accent); }

        .d-none { display: none !important; }

        /* ── Modal ── */
        .modal-content {
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(75, 104, 88, 0.15);
        }
        .modal-header {
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.25rem;
        }
        .modal-footer {
            border-top: 1px solid var(--border);
            padding: 0.85rem 1.25rem;
        }
        .modal-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-dark);
        }
    </style>
</head>
<body>

    <!-- ══ Header ══ -->
    <header class="app-header">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <h1><span class="header-lock"></span>Exam Language Trainer</h1>
                    <p class="subtitle">Quiz Management</p>
                </div>
                <div id="userInfo" class="d-none" style="font-size:0.78rem; color:rgba(255,255,255,0.85);">
                    <span id="userEmail"></span>
                    <button class="btn btn-sm btn-outline-light ms-2" id="signOutBtn" style="font-size:0.7rem; padding:2px 10px; border-radius:5px;">
                        Sign Out
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ══ Main Content ══ -->
    <div class="container py-4" style="max-width:760px;">

        <div class="d-flex align-items-center justify-content-between mb-4">
            <a href="index.html" class="nav-link-back">
                <i class="bi bi-arrow-left"></i> Back to Quiz Creator
            </a>
            <h2 style="font-size:1.15rem; font-weight:700; margin:0; color:var(--text-dark);">
                My Quizzes
            </h2>
        </div>

        <!-- Loading spinner -->
        <div class="d-flex align-items-center justify-content-center py-4" id="spinner-loading">
            <div class="spinner-border spinner-border-sm" role="status" style="color:var(--primary);"></div>
            <span style="font-size:0.9rem; color:var(--muted); margin-left:0.5rem;">
                Loading your quizzes…
            </span>
        </div>

        <!-- Quiz list rendered here by manage.js -->
        <div id="quizList"></div>
    </div>

    <!-- ══ Delete Confirmation Modal ══ -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle text-danger"></i>
                        Delete Quiz
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="font-size:0.9rem;">
                    Are you sure you want to delete "<span id="deleteQuizTitle"></span>"?
                    Students will no longer be able to access this quiz. This cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"
                            style="border-radius:8px; font-weight:500;">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn"
                            style="font-weight:600; border-radius:8px;">
                        <i class="bi bi-trash"></i> Delete Quiz
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/manage.js"></script>

</body>
</html>

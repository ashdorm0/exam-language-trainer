<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Language Trainer — My Quizzes</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Our design tokens + layout -->
    <link href="./css/styles.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* Page-specific styles — use tokens from styles.css */

        .manage-page {
            max-width: 860px;
            margin: 0 auto;
            padding: var(--space-8) var(--space-6);
        }

        /* Top row: back link + user controls */
        .manage-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-8);
        }

        .manage-back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.15s;
        }

        .manage-back-link:hover {
            color: var(--accent);
        }

        .manage-back-link .bi {
            font-size: 15px;
        }

        .manage-user-info {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            font-size: 13px;
            color: var(--text-muted);
        }

        .manage-user-info .manage-signout-btn {
            background: transparent;
            border: 1px solid var(--border-muted);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .manage-user-info .manage-signout-btn:hover {
            background: var(--bg-surface);
            color: var(--text-secondary);
        }

        /* Page heading */
        .manage-heading-label {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: var(--space-2);
            font-weight: 500;
        }

        .manage-heading-title {
            font-size: 30px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0 0 var(--space-6);
            line-height: 1.2;
        }

        /* Loading state */
        .manage-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8);
            color: var(--text-muted);
            font-size: 14px;
            gap: var(--space-3);
        }

        .manage-loading .spinner-border {
            color: var(--accent) !important;
            width: 16px;
            height: 16px;
            border-width: 2px;
        }

        /* Quiz cards */
        .quiz-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: var(--space-4);
            transition: border-color 0.15s;
        }

        .quiz-item:hover {
            border-color: var(--border-muted);
        }

        .quiz-title {
            font-size: 17px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .quiz-meta {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: var(--space-4);
        }

        .quiz-actions {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-muted);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .btn-action:hover {
            background: var(--bg-surface);
            color: var(--text-secondary);
            border-color: var(--border-muted);
        }

        .btn-action .bi {
            margin-right: 6px;
        }

        .btn-delete {
            border-color: rgba(176, 64, 64, 0.3);
            color: #e8a5a5;
        }

        .btn-delete:hover {
            background: rgba(176, 64, 64, 0.08);
            color: #f0bcbc;
            border-color: rgba(176, 64, 64, 0.5);
        }

        /* Share URL display (revealed via the share button) */
        .share-url {
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            color: var(--accent);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
            display: block;
            margin-top: var(--space-3);
        }

        .qr-container {
            margin-top: var(--space-3);
            display: inline-block;
            background: white;
            padding: 8px;
            border-radius: var(--radius-sm);
        }

        .quiz-detail-panel {
            display: none;
            margin-top: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-subtle);
        }

        .quiz-detail-panel.open {
            display: block;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px var(--space-4);
            color: var(--text-muted);
        }

        .empty-state .bi {
            font-size: 36px;
            display: block;
            margin-bottom: var(--space-3);
            color: var(--text-dim);
        }

        .empty-state-title {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .empty-state-sub {
            font-size: 14px;
            color: var(--text-dim);
        }

        .empty-state p {
            font-size: 15px;
            color: var(--text-muted);
            margin: 0 0 var(--space-4);
            line-height: 1.6;
        }

        .empty-state .nav-link-back {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            padding: 10px 18px;
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-md);
            transition: background 0.15s;
        }

        .empty-state .nav-link-back .bi {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1em;
            height: 1em;
            line-height: 1;
            margin-bottom: 0;
            font-size: 14px;
            color: currentColor;
            vertical-align: middle;
        }

        .empty-state .nav-link-back:hover {
            background: var(--accent-soft);
        }

        /* ── Delete confirmation modal ── */
        #deleteModal .modal-content {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-muted);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
        }

        #deleteModal .modal-header {
            border-bottom: 1px solid var(--border-subtle);
            padding: var(--space-4) var(--space-5);
        }

        #deleteModal .modal-title {
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 500;
        }

        #deleteModal .modal-title .bi {
            color: #e8a5a5;
        }

        #deleteModal .btn-close {
            filter: invert(1) grayscale(100%) brightness(2);
            opacity: 0.6;
        }

        #deleteModal .btn-close:hover {
            opacity: 1;
        }

        #deleteModal .modal-body {
            padding: var(--space-5);
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        #deleteModal #deleteQuizTitle {
            color: var(--text-primary);
            font-weight: 500;
        }

        #deleteModal .modal-footer {
            border-top: 1px solid var(--border-subtle);
            padding: var(--space-4) var(--space-5);
            gap: var(--space-3);
        }

        #deleteModal .btn-outline-secondary {
            background: transparent !important;
            border: 1px solid var(--border-muted) !important;
            color: var(--text-muted) !important;
            font-family: var(--font-sans) !important;
            font-size: 13px !important;
            font-weight: 400 !important;
            padding: 10px 16px !important;
            border-radius: var(--radius-md) !important;
        }

        #deleteModal .btn-outline-secondary:hover {
            background: var(--bg-surface) !important;
            color: var(--text-secondary) !important;
        }

        #deleteModal .btn-danger {
            background: #b04040 !important;
            border: none !important;
            color: #f5f5f5 !important;
            font-family: var(--font-sans) !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            padding: 10px 20px !important;
            border-radius: var(--radius-md) !important;
        }

        #deleteModal .btn-danger:hover {
            background: #c35050 !important;
        }
    </style>
</head>

<body>

    <div class="manage-page">

        <!-- Top bar: back link + user controls -->
        <div class="manage-topbar">
            <a href="index.html" class="manage-back-link">
                <i class="bi bi-arrow-left"></i> Back to quiz creator
            </a>
            <div id="userInfo" class="manage-user-info d-none">
                <span id="userEmail"></span>
                <button type="button" class="manage-signout-btn" id="signOutBtn">Sign out</button>
            </div>
        </div>

        <!-- Page heading -->
        <div>
            <div class="manage-heading-label">Library</div>
            <h1 class="manage-heading-title">My quizzes</h1>
        </div>

        <!-- Loading spinner -->
        <div class="manage-loading" id="spinner-loading">
            <div class="spinner-border" role="status"></div>
            <span>Loading your quizzes…</span>
        </div>

        <!-- Quiz list rendered here by manage.js -->
        <div id="quizList"></div>

    </div>

    <!-- ══ Delete Confirmation Modal ══ -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle"></i>
                        Delete quiz
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete "<span id="deleteQuizTitle"></span>"?
                    Students will no longer be able to access this quiz. This cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                        <i class="bi bi-trash"></i> Delete quiz
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/manage.js"></script>

</body>

</html>

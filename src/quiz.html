<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Language Trainer — Vocabulary Quiz</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* ── Shared design tokens — must match index.html ── */
        :root {
            --primary: #1a56db;
            --primary-dark: #1341b0;
            --success: #0e9f6e;
            --danger: #e02424;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
        }

        /* ── Header — identical to lecturer tool ── */
        .app-header {
            background: var(--primary);
            color: white;
            padding: 1.25rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0;
            font-family: 'Georgia', serif;
        }
        .app-header .subtitle {
            font-size: 0.85rem;
            opacity: 0.8;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* ── Main container ── */
        .quiz-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            padding: 2rem;
            margin-top: 2rem;
        }

        /* ── Landing screen ── */
        .landing-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        .landing h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .landing p {
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* ── Progress bar ── */
        .progress-label {
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        .progress {
            height: 6px;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }
        .progress-bar {
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* ── Question ── */
        .word-tag {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary);
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            font-family: Arial, sans-serif;
            margin-bottom: 1.25rem;
            line-height: 1.5;
        }

        /* ── Answer options ── */
        .option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.85rem 1.1rem;
            margin-bottom: 0.6rem;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 0.92rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
        }
        .option:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }
        .option.selected {
            border-color: var(--primary);
            background: #dbeafe;
            font-weight: 600;
        }
        .option.correct {
            border-color: var(--success);
            background: #f0fdf4;
            color: #166534;
            font-weight: 600;
        }
        .option.incorrect {
            border-color: var(--danger);
            background: #fef2f2;
            color: #991b1b;
        }

        /* ── Nav button ── */
        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            font-family: Arial, sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.7rem 1.75rem;
            border-radius: 6px;
            margin-top: 1rem;
            transition: background 0.15s;
        }
        .btn-next:hover:not(:disabled) { background: var(--primary-dark); color: white; }
        .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-start {
            background: var(--primary);
            color: white;
            border: none;
            font-family: Arial, sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.8rem 2.5rem;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .btn-start:hover { background: var(--primary-dark); color: white; }

        /* ── Results screen ── */
        .score-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            background: #eff6ff;
        }
        .score-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            font-family: Arial, sans-serif;
        }
        .score-label {
            font-size: 0.7rem;
            color: var(--muted);
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .review-card {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            font-family: Arial, sans-serif;
        }
        .review-card .word {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 0.25rem;
        }
        .review-card .correct-answer {
            color: var(--success);
            font-size: 0.875rem;
            font-weight: 600;
        }
        .review-card .question-q {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .btn-retake {
            background: none;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-family: Arial, sans-serif;
            font-weight: 600;
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            margin-top: 1rem;
            transition: all 0.15s;
        }
        .btn-retake:hover {
            background: var(--primary);
            color: white;
        }

        /* ── Error / loading states ── */
        .state-message {
            text-align: center;
            padding: 3rem 1rem;
            font-family: Arial, sans-serif;
            color: var(--muted);
        }
        .state-message i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- ══ Header — matches lecturer tool ══ -->
    <header class="app-header">
        <div class="container">
            <h1>Exam Language Trainer</h1>
            <p class="subtitle">Student Quiz Interface</p>
        </div>
    </header>

    <!-- ══ Quiz container ══ -->
    <!--
        quiz.js rewrites the innerHTML of .container dynamically.
        The landing div below is the initial state — quiz.js replaces it
        once the quiz loads from Firestore.
        All subsequent screens (question, results) are also rendered by quiz.js.
    -->
    <div class="container" style="max-width: 680px;">
        <div class="quiz-card">
            <div class="landing text-center">
                <div class="landing-icon"><i class="bi bi-book-half"></i></div>
                <h2>Vocabulary Quiz</h2>
                <p>Test your knowledge of key academic vocabulary<br>before your exam.</p>
                <div class="d-flex align-items-center justify-content-center gap-2 mb-3">
                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    <span style="font-family:Arial,sans-serif; font-size:0.88rem; color:var(--muted);">
                        Loading quiz…
                    </span>
                </div>
                <!-- quiz.js replaces this button's event listener once loaded -->
                <button class="btn-start start-btn" style="display:none;">
                    <i class="bi bi-play-fill"></i> Start Quiz
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Quiz logic — unchanged -->
    <script type="module" src="js/quiz.js"></script>

</body>
</html>

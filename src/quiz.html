<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Language Trainer — Vocabulary Quiz</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our design tokens -->
  <link href="./css/styles.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* ── Quiz page layout ── */
    .quiz-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
    }

    /* ── Main card ── */
    .quiz-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      width: 100%;
      max-width: 640px;
    }

    /* ── Brand mark at the top ── */
    .quiz-brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-8);
    }

    .quiz-brand-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .quiz-brand-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── Landing screen ── */
    .landing {
      text-align: center;
    }

    .landing-icon {
      font-size: 28px;
      color: var(--accent);
      margin-bottom: var(--space-4);
    }

    .landing h2 {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: var(--space-2);
    }

    .landing p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: var(--space-6);
      line-height: 1.5;
    }

    /* ── Start / primary buttons ── */
    .btn-start {
      background: var(--accent);
      color: var(--bg-base);
      border: none;
      font-weight: 500;
      font-size: 13px;
      padding: 10px 24px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-start:hover {
      background: #a0e2be;
      color: var(--bg-base);
    }

    /* ── Progress bar ── */
    .progress-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: var(--space-2);
      font-weight: 500;
    }

    .progress {
      height: 4px;
      border-radius: 2px;
      margin-bottom: var(--space-6);
      background: var(--border-subtle);
    }

    .progress-bar {
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* ── Question display ── */
    .word-tag {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--space-3);
    }

    .question-text {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: var(--space-5);
      line-height: 1.5;
      color: var(--text-primary);
    }

    /* ── Answer options ── */
    .option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: var(--space-2);
      background: transparent;
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: var(--font-sans);
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .option:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .option.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text-primary);
      font-weight: 500;
    }

    .option.correct {
      border-color: var(--accent);
      background: rgba(125, 211, 160, 0.06);
      color: var(--accent);
      font-weight: 500;
    }

    .option.incorrect {
      border-color: rgba(176, 64, 64, 0.5);
      background: rgba(176, 64, 64, 0.06);
      color: #e8a5a5;
    }

    /* ── Next / submit button ── */
    .btn-next {
      background: var(--accent);
      color: var(--bg-base);
      border: none;
      font-weight: 500;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      margin-top: var(--space-4);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-next:hover:not(:disabled) {
      background: #a0e2be;
      color: var(--bg-base);
    }

    .btn-next:disabled {
      background: var(--bg-surface-2);
      color: var(--text-faint);
      cursor: not-allowed;
      opacity: 1;
    }

    /* ── Results screen ── */
    .score-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-5);
      background: var(--accent-soft);
    }

    .score-number {
      font-size: 28px;
      font-weight: 500;
      color: var(--accent);
      line-height: 1;
    }

    .score-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    /* ── Review cards (wrong answers) ── */
    .review-card {
      background: var(--bg-surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-5);
      margin-bottom: var(--space-3);
    }

    .review-card .word {
      font-weight: 500;
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .review-card .question-q {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: var(--space-2);
    }

    .review-card .correct-answer {
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
    }

    /* ── Retake button ── */
    .btn-retake {
      background: transparent;
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-weight: 500;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      margin-top: var(--space-4);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-retake:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* ── Error / loading states ── */
    .state-message {
      text-align: center;
      padding: 48px var(--space-4);
      color: var(--text-muted);
    }

    .state-message i {
      font-size: 28px;
      display: block;
      margin-bottom: var(--space-3);
      color: var(--text-dim);
    }

    .state-message p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── Spinner in loading state ── */
    .spinner-border {
      color: var(--accent) !important;
      width: 16px;
      height: 16px;
      border-width: 2px;
    }

    /* ── Inline styles from quiz.js that need dark overrides ──
       quiz.js sets color:var(--muted) on some elements via inline styles.
       We reassign --muted here so those inline styles pick up dark values. */
    :root {
      --muted: var(--text-dim);
      --text-dark: var(--text-primary);
      --success: var(--accent);
    }
  </style>
</head>

<body>

  <div class="quiz-page">

    <!-- Brand mark -->
    <div style="width: 100%; max-width: 640px; margin-bottom: var(--space-4);">
      <div class="quiz-brand">
        <span class="quiz-brand-dot"></span>
        <span class="quiz-brand-label">Exam trainer</span>
      </div>
    </div>

    <!-- Quiz container -->
    <div class="quiz-card">
      <div class="landing text-center">
        <div class="landing-icon"><i class="bi bi-book-half"></i></div>
        <h2>Vocabulary Quiz</h2>
        <p>Test your knowledge of key academic vocabulary<br>before your exam.</p>
        <div class="d-flex align-items-center justify-content-center gap-2 mb-3">
          <div class="spinner-border" role="status"></div>
          <span style="font-size:13px; color:var(--text-muted);">
            Loading quiz…
          </span>
        </div>
        <button class="btn-start start-btn" style="display:none;">
          <i class="bi bi-play-fill"></i> Start Quiz
        </button>
      </div>
    </div>

  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Quiz logic — unchanged -->
  <script type="module" src="js/quiz.js"></script>

</body>

</html>
